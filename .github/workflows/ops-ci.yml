name: Operations checks
on:
  pull_request:
  push:
    branches: ["feat/personal-ops"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run typecheck && npm run build
      - run: python -m pip install -r requirements-ops.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_ops.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-package
          path: skill.zip
          retention-days: 14
