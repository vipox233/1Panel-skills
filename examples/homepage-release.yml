# Copy into the HOMEPAGE repository after reviewing its build output.
# This is an inactive example in the Skill repository.
name: Build static release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: static-site-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
      - name: Package only public static output
        run: |
          cd dist
          zip -r ../site.zip . -x 'data/*' 'uploads/*' '.*' '*/.*'
          cd ..
          sha256sum site.zip > site.zip.sha256
      - name: Upload rolling public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view site-deploy >/dev/null 2>&1 || gh release create site-deploy --title 'Static deployment artifacts' --notes 'Built static files only.'
          gh release upload site-deploy site.zip site.zip.sha256 --clobber
